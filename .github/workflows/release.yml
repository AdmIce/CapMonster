name: Publicar versão

# Dispara ao empurrar uma tag "v1.2.3". Marcar a tag é o único ato manual:
# o resto (exportar o cliente e anexar na release) acontece aqui, para não
# depender da máquina de ninguém nem de alguém lembrar de anexar o arquivo.
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: ubuntu-latest
    container:
      image: barichello/godot-ci:4.3
    steps:
      # Histórico inteiro e com as tags: as notas da versão são montadas a
      # partir dos commits desde a tag anterior, e um checkout raso não teria
      # nem os commits nem a tag para comparar.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # A imagem já traz os templates; o export procura em ~/.local/share.
      - name: Preparar templates de exportação
        run: |
          mkdir -p ~/.local/share/godot/export_templates
          cp -r /root/.local/share/godot/export_templates/* ~/.local/share/godot/export_templates/ || true
          ls ~/.local/share/godot/export_templates

      # O cache de importação (.godot/) não vai no repositório, então precisa ser
      # gerado aqui. A primeira passada costuma falhar em asset que depende de
      # outro já importado; a segunda fecha.
      - name: Importar assets
        run: |
          godot --headless --import --quit || true
          godot --headless --import --quit || true

      - name: Exportar cliente Windows
        run: |
          mkdir -p build/windows
          godot --headless --export-release "Windows Desktop" build/windows/CapMonster.exe
          ls -lh build/windows

      # O jogo procura exatamente estes dois nomes ao se atualizar
      # (scripts/core/Atualizador.gd). Renomear aqui quebra a atualização.
      # As notas que o GitHub gera sozinho saem só com o link de comparação
      # quando os commits vão direto na main, sem pull request -- que é como
      # este projeto trabalha. Então elas são montadas aqui: a frase que o
      # `tools/lancar.ps1 -Notas` gravou na tag, e abaixo o que mudou.
      - name: Montar as notas da versão
        id: notas
        # Sem `set -e` de propósito, e com `|| true` em toda chamada externa.
        # A v0.8.0 não foi publicada porque esta etapa falhou: o build inteiro
        # tinha passado, o .exe estava pronto, e uma etapa que só escreve texto
        # derrubou a entrega. Nota de versão é cosmética -- na pior das
        # hipóteses ela sai pobre, nunca segura a release.
        run: |
          VERSAO="${GITHUB_REF_NAME}"

          # O container roda como root sobre um diretório de outro dono, e o git
          # recusa trabalhar aí ("dubious ownership") -- foi o suspeito número um
          # da falha, já que todo o resto da etapa é git.
          git config --global --add safe.directory "${GITHUB_WORKSPACE}" || true

          # Mensagem da tag, sem a linha "v0.7.0:" que o lancar.ps1 põe na
          # frente -- quem lê já sabe qual versão está lendo.
          TITULO=$(git tag -l --format='%(contents:subject)' "${VERSAO}" 2>/dev/null | sed "s/^${VERSAO}: *//" || echo "")

          # Tag anterior nesta linha do tempo. Na primeira versão não existe, e
          # aí a lista é o histórico inteiro.
          ANTERIOR=$(git describe --tags --abbrev=0 "${VERSAO}^" 2>/dev/null || echo "")
          if [ -n "${ANTERIOR}" ]; then
            FAIXA="${ANTERIOR}..${VERSAO}"
          else
            FAIXA="${VERSAO}"
          fi

          # Só o assunto de cada commit, sem os de merge e sem o commit que só
          # troca o número da versão -- ninguém precisa ler "v0.7.0" na lista do
          # que mudou na v0.7.0.
          MUDANCAS=$(git log --no-merges --pretty=format:'%s' "${FAIXA}" 2>/dev/null \
            | grep -v -E '^v[0-9]+\.[0-9]+\.[0-9]+' \
            | sed 's/^/- /' || echo "")

          # Ecoado no log da etapa: quando a nota sair pobre, dá para ver aqui
          # qual das duas partes veio vazia, sem precisar abrir o repositório.
          echo "titulo: [${TITULO}]"
          echo "faixa:  [${FAIXA}]"
          echo "mudancas:"
          echo "${MUDANCAS}"

          {
            echo "corpo<<FIM_DAS_NOTAS"
            if [ -n "${TITULO}" ]; then
              echo "**${TITULO}**"
              echo
            fi
            if [ -n "${MUDANCAS}" ]; then
              echo "${MUDANCAS}"
            else
              echo "Detalhes na lista de commits desta versao."
            fi
            echo "FIM_DAS_NOTAS"
          } >> "${GITHUB_OUTPUT}"

          exit 0

      - name: Publicar release
        uses: softprops/action-gh-release@v2
        with:
          # Nossas notas, não as automáticas: ver a etapa acima.
          body: ${{ steps.notas.outputs.corpo }}
          generate_release_notes: false
          files: |
            build/windows/CapMonster.exe
            build/windows/CapMonster.pck

  # Avisa a galera no Discord. Roda depois e em separado de propósito: se o
  # Discord estiver fora do ar, a release já está publicada e o jogo já se
  # atualiza sozinho -- o aviso é conveniência, não parte da entrega.
  discord:
    needs: windows
    runs-on: ubuntu-latest
    steps:
      - name: Avisar no Discord
        env:
          # Segredo do repositório (Settings > Secrets and variables > Actions).
          # A URL do webhook é uma senha: quem tiver ela posta no canal como se
          # fosse o dono. Por isso ela nunca aparece neste arquivo, que é público.
          WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
          VERSAO: ${{ github.ref_name }}
          REPO: ${{ github.repository }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          if [ -z "${WEBHOOK}" ]; then
            echo "DISCORD_WEBHOOK nao esta configurado; publicacao segue sem aviso."
            exit 0
          fi

          PAGINA="https://github.com/${REPO}/releases/tag/${VERSAO}"

          # As notas são as que o GitHub gera a partir dos commits. Se a busca
          # falhar (rodou pelo botao, sem tag), o aviso sai só com o link em vez
          # de a etapa inteira quebrar.
          NOTAS=$(curl -sf -H "Authorization: Bearer ${GH_TOKEN}" \
            "https://api.github.com/repos/${REPO}/releases/tags/${VERSAO}" \
            | jq -r '.body // ""' || echo "")

          # Fora o "Full Changelog: <link>". No Discord ninguém vai ler um diff
          # de commits, e uma mensagem que é só um link não diz o que mudou.
          # O nome da versão no topo já leva para a página.
          NOTAS=$(printf '%s' "${NOTAS}" | grep -v -i 'Full Changelog' || true)
          NOTAS=$(printf '%s' "${NOTAS}" | sed -e 's/[[:space:]]*$//' -e '/./,$!d')

          if [ -z "${NOTAS}" ]; then
            NOTAS="Detalhes na pagina da versao."
          fi
          # O limite do Discord para a descricao e 4096; cortar antes evita a
          # mensagem inteira ser recusada por causa de um changelog longo.
          NOTAS=$(printf '%s' "${NOTAS}" | head -c 3500)

          # jq monta o JSON para que aspas e quebras de linha das notas nao
          # quebrem o payload.
          jq -n \
            --arg titulo "CapMonster ${VERSAO} no ar" \
            --arg url "${PAGINA}" \
            --arg notas "${NOTAS}" \
            '{
              username: "CapMonster",
              embeds: [{
                title: $titulo,
                url: $url,
                description: $notas,
                color: 13210159,
                footer: { text: "Abra o jogo no menu e ele se atualiza sozinho." }
              }]
            }' > payload.json

          curl -sS -f -X POST -H "Content-Type: application/json" \
            -d @payload.json "${WEBHOOK}" && echo "Aviso enviado."
