name: Verificar

# Roda em todo push e em todo Pull Request. É o que impede que um script
# quebrado chegue na main quando duas pessoas mexem no mesmo projeto — e o que
# dá para um assistente de IA um sinal objetivo de "passou" em vez de opinião.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  validar:
    runs-on: ubuntu-latest
    container:
      image: barichello/godot-ci:4.3
    steps:
      - uses: actions/checkout@v4

      # Os dois validadores em Python não precisam da engine e são rápidos:
      # referências quebradas no /data e erros baratos de GDScript.
      - name: Banco de dados
        run: python3 tools/validate_data.py

      - name: Scripts
        run: python3 tools/check_scripts.py

      # O cache de importação não vai no repositório. A primeira passada falha
      # em asset que depende de outro já importado; a segunda fecha.
      - name: Importar assets
        run: |
          godot --headless --import --quit || true
          godot --headless --import --quit || true

      # O teste de fumaça é o juiz final: ele entra no mundo de verdade. Erro de
      # parse e falha em tempo de execução aparecem aqui, e nenhum dos dois passa
      # pelos validadores anteriores.
      - name: Teste de fumaça
        run: |
          godot --headless --quit-after 900 -- --smoke 2>&1 | tee /tmp/fumaca.log
          if grep -qE "SCRIPT ERROR|Parse Error|Compile Error" /tmp/fumaca.log; then
            echo "::error::O jogo registrou erro de script ao entrar no mundo."
            grep -E "SCRIPT ERROR|Parse Error|Compile Error" /tmp/fumaca.log | head -20
            exit 1
          fi
          echo "Mundo carregou sem erro de script."
